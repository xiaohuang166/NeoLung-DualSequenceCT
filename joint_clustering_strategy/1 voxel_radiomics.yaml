# PyRadiomics Configuration File - Only GLCM JointEntropy
# This configuration extracts only the GLCM JointEntropy feature

# Settings for preprocessing and feature extraction
setting:
  binWidth: 20
  label: 1
  interpolator:  # This is an enumerated value, here None is not allowed
#  resampledPixelSpacing:  # This disables resampling, as it is interpreted as None, to enable it, specify spacing in x, y, z as [x, y , z]
  weightingNorm: # If no value is specified, it is interpreted as None
  correctMask: True
#  preCrop: True
  normalize: True
  normalizeScale: 2000

voxelSetting:
  kernelRadius: 3
  maskedKernel: True
  initValue: nan
  voxelBatch: 100
#  voxelBatch: 100
  #geometryTolerance:
# Image types to use: "Original" for unfiltered image, for possible filters, see documentation.
# Image types to use


imageType:
  Original: {}

# Feature classes - only enable GLCM JointEntropy
featureClass:
  glcm:
    - 'JointEntropy'
